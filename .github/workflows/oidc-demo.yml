name: oidc-demo

# Demonstrates GitHub Actions authenticating to Vault via JWT/OIDC.
# Requires a Vault reachable from GitHub runners and the repo variable VAULT_ADDR.
on:
  workflow_dispatch:
    inputs:
      team:
        description: Team (must match a GitHub environment and Vault role)
        required: true
        default: team1

permissions:
  id-token: write
  contents: read

jobs:
  mint-token:
    runs-on: ubuntu-latest
    environment: ${{ inputs.team }}
    steps:
      - name: Get short-lived TFE token from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          path: jwt-github
          role: ${{ inputs.team }}
          jwtGithubAudience: vault
          secrets: |
            terraform/creds/${{ inputs.team }} token | TF_TOKEN_app_terraform_io
      - name: Verify token present
        run: test -n "$TF_TOKEN_app_terraform_io" && echo "token received"
