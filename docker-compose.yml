services:
  vault:
    image: hashicorp/vault:2.2
    container_name: tfe-vault
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      # Dev mode only: in-memory storage, auto-unsealed, static root token.
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
